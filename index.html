<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1f6feb" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <title>Voice Notes — Offline Whisper</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <button id="sidebarToggle" type="button" class="icon-btn" title="Show/hide notes" aria-label="Toggle notes list">
        <span class="hamburger"></span>
      </button>
      <span class="dot" id="statusDot" title="Model status"></span>
      <h1>Voice Notes</h1>
    </div>
    <div class="header-actions">
      <select id="micSelect" title="Microphone (input device)">
        <option value="">Default microphone</option>
      </select>
      <select id="modelSelect" title="Model (larger = more accurate, slower)">
        <option value="Xenova/whisper-tiny.en">tiny.en (fastest)</option>
        <option value="Xenova/whisper-base.en" selected>base.en (balanced)</option>
        <option value="Xenova/whisper-small.en">small.en (most accurate)</option>
      </select>
      <label class="switch" title="Transcribe continuously as you speak (uses more CPU)">
        <input type="checkbox" id="liveToggle" />
        <span class="switch-track"><span class="switch-thumb"></span></span>
        <span class="switch-label">Live</span>
      </label>
      <button id="exportBtn" class="btn ghost" title="Download current note as .txt">Export</button>
      <button id="newBtn" class="btn ghost" title="Create a new note">New</button>
    </div>
  </header>

  <div class="app-body">
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-head">
        <span class="sidebar-title">Notes</span>
        <button id="newNoteBtn" class="btn ghost small" title="Create a new note">+ New</button>
      </div>
      <div class="sidebar-search">
        <input
          id="searchInput"
          class="search-input"
          type="search"
          placeholder="Search notes…"
          aria-label="Search notes"
          autocomplete="off"
        />
      </div>
      <ul id="notesList" class="notes-list" aria-label="Saved notes"></ul>
      <div id="syncBar" class="sync-bar">
        <div class="sync-status">
          <span id="syncDot" class="sync-dot" title="Folder sync status"></span>
          <span id="syncText" class="sync-text">Folder sync off</span>
        </div>
        <div class="sync-actions">
          <button id="connectFolderBtn" class="btn ghost small" title="Save notes as .txt files in a folder you choose (e.g. inside your Google Drive)">Connect folder</button>
          <button id="disconnectFolderBtn" class="btn ghost small" title="Stop syncing to the folder" hidden>Disconnect</button>
        </div>
        <label id="readToggleRow" class="switch sync-read" title="Also detect and pull in edits made to the files outside this app" hidden>
          <input type="checkbox" id="readToggle" />
          <span class="switch-track"><span class="switch-thumb"></span></span>
          <span class="switch-label">Read external edits</span>
        </label>
      </div>
    </aside>

    <div id="sidebarBackdrop" class="sidebar-backdrop" hidden></div>

    <main class="app-main">
      <div class="note-titlebar">
        <input
          id="noteTitle"
          class="note-title"
          type="text"
          placeholder="Untitled note"
          aria-label="Note title"
        />
      </div>

      <div id="status" class="status" aria-live="polite">Ready. Click Record to start.</div>

      <div class="editor-wrap">
        <div
          id="editor"
          class="editor"
          contenteditable="true"
          spellcheck="true"
          data-placeholder="Your ideas will appear here. You can also type or edit directly…"
          aria-label="Document editor"
        ></div>
      </div>

      <footer class="app-footer">
        <div class="footer-info">
          <span id="saveState" class="save-state">Saved</span>
          <span id="wordCount" class="word-count">0 words</span>
        </div>
        <button id="recordBtn" class="record-btn" aria-pressed="false">
          <span class="record-icon"></span>
          <span class="record-label">Record</span>
        </button>
      </footer>
    </main>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>

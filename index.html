<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1f6feb" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <title>Voice Notes — Offline Whisper</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <span class="dot" id="statusDot" title="Model status"></span>
      <h1>Voice Notes</h1>
    </div>
    <div class="header-actions">
      <select id="modelSelect" title="Model (larger = more accurate, slower)">
        <option value="Xenova/whisper-tiny.en">tiny.en (fastest)</option>
        <option value="Xenova/whisper-base.en" selected>base.en (balanced)</option>
        <option value="Xenova/whisper-small.en">small.en (most accurate)</option>
      </select>
      <button id="exportBtn" class="btn ghost" title="Download as .txt">Export</button>
      <button id="newBtn" class="btn ghost" title="Clear and start a new note">New</button>
    </div>
  </header>

  <main class="app-main">
    <div id="status" class="status" aria-live="polite">Ready. Click Record to start.</div>

    <div class="editor-wrap">
      <div
        id="editor"
        class="editor"
        contenteditable="true"
        spellcheck="true"
        data-placeholder="Your ideas will appear here. You can also type or edit directly…"
        aria-label="Document editor"
      ></div>
    </div>
  </main>

  <footer class="app-footer">
    <div class="footer-info">
      <span id="saveState" class="save-state">Saved</span>
      <span id="wordCount" class="word-count">0 words</span>
    </div>
    <button id="recordBtn" class="record-btn" aria-pressed="false">
      <span class="record-icon"></span>
      <span class="record-label">Record</span>
    </button>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
